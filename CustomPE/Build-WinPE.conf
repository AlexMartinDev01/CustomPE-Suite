# =============================================
#  CustomPE global configuration
#  Edit CustomPE_NAME to rename the project.
#  This is the ONLY file you need to change.
# =============================================
CustomPE_NAME=CustomPE
CustomPE_AUTHOR=AlexMartin
CustomPE_VERSION=1.0
# Build workspace (output folder); ISO is written to %CustomPE_WORKDIR%\ISO\%CustomPE_NAME%.iso
# NOTE: this whole folder is deleted and recreated on every build - never point it at
# the project folder, a drive root, or any directory that contains data you need.
CustomPE_WORKDIR=
# Driver repository: scanned recursively; every folder that directly contains a .inf is injected
CustomPE_DRVREPO=
# WinPE_OCs folder (leave empty to auto-detect from the ADK installation)
CustomPE_OCSPATH=
# Optional components, multiple packages separated by ;.
# Language packs (en-us) are added automatically when available for each package.
COMPONENTS_51=WinPE-WMI.cab;WinPE-StorageWMI.cab;WinPE-Scripting.cab;WinPE-HTA.cab
COMPONENTS_52=WinPE-NetFx.cab;WinPE-PowerShell.cab
COMPONENTS_53=WinPE-EnhancedStorage.cab;WinPE-SecureStartup.cab;WinPE-WDS-Tools.cab;WinPE-PlatformId.cab;WinPE-MDAC.cab;WinPE-DismCmdlets.cab;WinPE-Dot3Svc.cab;WinPE-RNDIS.cab;WinPE-SecureBootCmdlets.cab
COMPONENTS_54=WinPE-Fonts-Legacy.cab;WinPE-FontSupport-ZH-CN.cab;WinPE-FontSupport-ZH-HK.cab;WinPE-FontSupport-ZH-TW.cab;WinPE-FontSupport-JA-JP.cab;WinPE-FontSupport-KO-KR.cab
# Locale folders moved from the media root into Boot\ (OEM layout)
LOCALE_DIRS=bg-bg;cs-cz;da-dk;de-de;el-gr;en-gb;en-us;es-es;es-mx;et-ee;fi-fi;fr-ca;fr-fr;hr-hr;hu-hu;it-it;ja-jp;ko-kr;lt-lt;lv-lv;nb-no;nl-nl;pl-pl;pt-br;pt-pt;ro-ro;ru-ru;sk-sk;sl-si;sr-latn-rs;sv-se;tr-tr;uk-ua;zh-cn;zh-tw
# Offline registry settings applied to the SOFTWARE hive.
# Format: relative key | value name | type | data | description
REG_ADD=Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell|ExecutionPolicy|REG_SZ|Unrestricted|PowerShell ExecutionPolicy = Unrestricted
REG_ADD=Microsoft\Windows NT\CurrentVersion\FontSubstitutes|MS Shell Dlg|REG_SZ|Microsoft YaHei UI|FontSubstitute: MS Shell Dlg -> Microsoft YaHei UI
REG_ADD=Microsoft\Windows\CurrentVersion\ThemeManager|ThemeActive|REG_SZ|1|ThemeActive = 1
REG_ADD=Microsoft\Windows NT\CurrentVersion\Fonts|Microsoft YaHei (TrueType)|REG_SZ|msyh.ttc|Font: Microsoft YaHei
REG_ADD=Microsoft\Windows NT\CurrentVersion\Fonts|Microsoft YaHei Bold (TrueType)|REG_SZ|msyhbd.ttc|Font: Microsoft YaHei Bold
REG_ADD=Microsoft\Windows NT\CurrentVersion\Fonts|Segoe UI (TrueType)|REG_SZ|segoeui.ttf|Font: Segoe UI
REG_ADD=Microsoft\Windows NT\CurrentVersion\ICU\Global|DefaultLanguage|REG_SZ|en-us|ICU DefaultLanguage = en-us
REG_ADD=Microsoft\Windows NT\CurrentVersion\ICU\Global|DefaultLanguageGroup|REG_SZ|en-us|ICU DefaultLanguageGroup = en-us
